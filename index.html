<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>地上戦活動DB Ver.2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="loginView">
 <div class="login-card panel"><div class="brand">🏘️ 地上戦活動DB <small>Ver.2</small></div><div class="sub">支部別・ユーザー別ログイン対応</div>
 <div id="loginMsg"></div><label class="label">ユーザーID</label><input id="loginId" autocomplete="username"><label class="label">パスワード</label><input id="loginPassword" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%;margin-top:16px" onclick="login()">ログイン</button>
 <div class="notice" style="margin-top:12px">初回設定後、管理者が利用者を登録します。</div></div>
</div>
<div id="app" class="hidden">
 <div class="header"><div><div class="brand">🏘️ 地上戦活動DB</div><div class="sub" id="branchLabel"></div></div><div class="userbox"><b id="userName"></b><br><span id="userRole"></span><br><button class="btn" style="padding:6px 9px;margin-top:5px" onclick="logout()">ログアウト</button></div></div>
 <div id="appMsg"></div>
 <div class="panel stats"><div class="stat"><b id="statTotal">0</b>登録</div><div class="stat"><b id="statVisited">0</b>訪問済</div><div class="stat"><b id="statRevisit">0</b>再訪</div></div>
 <div class="tabs"><button class="tab active" data-view="map" onclick="showView('map')">地図</button><button class="tab" data-view="list" onclick="showView('list')">一覧</button><button class="tab" data-view="revisit" onclick="showView('revisit')">再訪</button><button class="tab" data-view="analysis" onclick="showView('analysis')">分析</button><button id="adminTab" class="tab hidden" data-view="admin" onclick="showView('admin')">管理</button></div>
 <section id="view-map"><div class="row"><input id="searchText" placeholder="住所検索"><button class="btn primary" onclick="searchMap()">検索</button></div><div class="row"><button class="btn primary" onclick="addCurrentLocation()">📍現在地</button><button class="btn" onclick="loadRecords()">🔄最新表示</button></div><div id="map"></div></section>
 <section id="view-list" class="hidden"><div class="panel"><input id="listSearch" placeholder="名前・住所・メモ・担当者" oninput="renderLists()"></div><div id="listCards" class="list"></div></section>
 <section id="view-revisit" class="hidden"><div id="revisitCards" class="list"></div></section>
 <section id="view-analysis" class="hidden"></section>
 <section id="view-admin" class="hidden"><div class="panel"><div class="card-title">ユーザー追加</div><label class="label">ユーザーID</label><input id="newLoginId"><label class="label">表示名</label><input id="newName"><label class="label">初期パスワード</label><input id="newPassword" type="password"><label class="label">権限</label><select id="newRole"><option value="member">一般</option><option value="leader">支部管理者</option><option value="prefecture_admin">県連管理者</option></select><label class="label">所属支部</label><select id="newBranch"></select><button class="btn primary" style="width:100%;margin-top:14px" onclick="createUser()">ユーザーを追加</button></div><div class="panel"><div class="card-title">登録ユーザー</div><div id="usersTable"></div></div></section>
</div>
<div id="editModal" class="modal-bg" onclick="closeEdit()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><div class="modal-title">訪問先</div><button class="close" onclick="closeEdit()">×</button></div>
 <input id="recordId" type="hidden"><input id="lat" type="hidden"><input id="lng" type="hidden"><label class="label">住所</label><input id="fullAddress"><label class="label">名前・呼び名</label><input id="personName"><label class="label">状態</label><div id="statusGrid" class="status-grid"></div><label class="label">支持者候補</label><select id="supporter"><option value="">未設定</option><option>◎有力</option><option>○可能性あり</option><option>△様子見</option><option>×なし</option></select><label class="label">再訪優先度</label><select id="priority"><option value="">なし</option><option>△低</option><option>○中</option><option>◎高</option></select><label class="label">対象種別</label><select id="type"><option>戸建て</option><option>集合住宅</option><option>事業所</option><option>その他</option></select><label class="label">訪問日</label><input id="date" type="date"><label class="label">メモ</label><textarea id="memo"></textarea><div class="actions"><button class="btn primary" onclick="saveRecord()">保存</button><button class="btn danger" onclick="deleteRecord()">削除</button></div>
 </div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/map.js"></script>
<script src="assets/js/records.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/admin.js"></script>
<script src="assets/js/main.js"></script></body></html>
